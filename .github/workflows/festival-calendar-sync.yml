name: Festival calendar sync

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update festival dates
        run: node scripts/update-festival-calendar.js
      - name: Verify calendar
        run: node scripts/test-festival-calendar.js
      - name: Commit verified calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/festivals.json data/festival-sync-log.json
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "chore: sync verified Indian festival dates"
          git push
